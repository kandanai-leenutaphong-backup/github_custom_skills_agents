<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure AI Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
      width: min(700px, 96vw);
      height: min(640px, 90dvh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f62fe;
      color: #fff;
      padding: 16px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #0f62fe;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f0f4f8;
      color: #1c1c1c;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: center;
      background: #fff0f0;
      color: #c00;
      border: 1px solid #f5c2c2;
      font-size: 0.875rem;
    }

    .typing-indicator {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      background: #f0f4f8;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }

    .dot {
      width: 8px; height: 8px;
      background: #666;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    #input-area {
      border-top: 1px solid #e2e8f0;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border-color .2s;
      max-height: 120px;
    }
    #user-input:focus { border-color: #0f62fe; }

    #send-btn {
      background: #0f62fe;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background .2s, opacity .2s;
      align-self: flex-end;
    }
    #send-btn:hover:not(:disabled) { background: #0353e9; }
    #send-btn:disabled { opacity: .5; cursor: not-allowed; }

    .sample-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 16px;
    }

    .sample-chip {
      background: #e8f0fe;
      color: #0f62fe;
      border: 1px solid #b3d0ff;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background .2s;
    }
    .sample-chip:hover { background: #b3d0ff; }
  </style>
</head>
<body>
  <div id="app">
    <header>🤖 Azure AI Chatbot</header>
    <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
    <div class="sample-prompts" id="sample-prompts" aria-label="Sample prompts"></div>
    <div id="input-area">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Type a message…"
        aria-label="Your message"
        maxlength="4000"
      ></textarea>
      <button id="send-btn" type="button" aria-label="Send message">Send</button>
    </div>
  </div>

  <script>
    // Configuration — override window.API_BASE_URL to point to your backend.
    // Default uses the nginx proxy path (/api) or direct localhost for local dev.
    const API_BASE_URL = window.API_BASE_URL || '/api';

    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const samplesEl  = document.getElementById('sample-prompts');

    /** Conversation history sent to the backend on every request. */
    const history = [];

    /** Safely append a message bubble — uses textContent to prevent XSS. */
    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text; // textContent prevents XSS (OWASP A03)
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTypingIndicator() {
      const el = document.createElement('div');
      el.className = 'typing-indicator';
      el.id = 'typing';
      el.setAttribute('aria-label', 'Assistant is typing');
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        el.appendChild(dot);
      }
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTypingIndicator() {
      document.getElementById('typing')?.remove();
    }

    function setInputEnabled(enabled) {
      inputEl.disabled  = !enabled;
      sendBtn.disabled  = !enabled;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      samplesEl.style.display = 'none';

      history.push({ role: 'user', content: text });
      appendMessage('user', text);
      setInputEnabled(false);
      showTypingIndicator();

      try {
        const response = await fetch(`${API_BASE_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });

        removeTypingIndicator();

        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: 'Unknown error' }));
          const detail = err.detail || `Error ${response.status}`;
          history.pop(); // remove undelivered user message from history
          appendMessage('error', `⚠️ ${detail}`);
        } else {
          const data = await response.json();
          history.push({ role: 'assistant', content: data.reply });
          appendMessage('assistant', data.reply);
        }
      } catch (networkError) {
        removeTypingIndicator();
        history.pop();
        appendMessage('error', '⚠️ Could not reach the server. Check your connection.');
      } finally {
        setInputEnabled(true);
        inputEl.focus();
      }
    }

    // Send on button click or Enter (Shift+Enter for newline)
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = `${inputEl.scrollHeight}px`;
    });

    // Load sample prompts
    async function loadSamplePrompts() {
      try {
        const res = await fetch('/sample_prompts.json');
        if (!res.ok) return;
        const data = await res.json();
        (data.prompts || []).slice(0, 4).forEach((p) => {
          const chip = document.createElement('button');
          chip.className = 'sample-chip';
          chip.type = 'button';
          chip.textContent = p.title; // textContent is XSS-safe
          chip.setAttribute('aria-label', `Sample prompt: ${p.title}`);
          chip.addEventListener('click', () => {
            inputEl.value = p.prompt;
            inputEl.dispatchEvent(new Event('input'));
            inputEl.focus();
          });
          samplesEl.appendChild(chip);
        });
      } catch (_) {
        // Sample prompts are optional — silently ignore failures
      }
    }

    loadSamplePrompts();
  </script>
</body>
</html>
